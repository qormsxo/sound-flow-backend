version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sound-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-mupat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mupat_password}
      POSTGRES_DB: ${DB_DATABASE:-sound_flow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mupat} -d ${DB_DATABASE:-sound_flow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sound-flow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # (선택) Redis 데이터를 눈으로 확인하고 싶을 때 사용
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sound-flow-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  pgdata:
  redisdata:
