<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모아리 챗 테스트 - Mupat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --bubble-user: #4f7cff;
    --bubble-assistant: #232733;
    --text: #e8eaf0;
    --text-dim: #9aa0ab;
    --accent: #7c5cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px 20px;
    background: linear-gradient(135deg, var(--accent), #4f7cff);
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
  }
  header .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { font-size: 12px; margin: 2px 0 0; opacity: 0.85; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--bg);
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .row.assistant .bubble {
    background: var(--bubble-assistant);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .row.assistant .bubble.typing::after {
    content: '▍';
    animation: blink 1s step-start infinite;
    color: var(--text-dim);
  }
  @keyframes blink { 50% { opacity: 0; } }
  .meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  .suggestions {
    display: flex;
    gap: 8px;
    padding: 0 16px 8px;
    overflow-x: auto;
  }
  .chip {
    flex: none;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid #2a2e3a;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px 16px 18px;
    background: var(--panel);
    border-top: 1px solid #22252f;
  }
  #messageInput {
    flex: 1;
    resize: none;
    border-radius: 12px;
    border: 1px solid #2a2e3a;
    background: #10121a;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    height: 44px;
    font-family: inherit;
  }
  #messageInput:focus { outline: none; border-color: var(--accent); }
  #sendBtn {
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-line {
    font-size: 11px;
    color: var(--text-dim);
    padding: 0 16px 6px;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">🎧</div>
      <div>
        <h1>모아리</h1>
        <p>뮤팟(Mupat) AI 캐릭터 챗 · 실제 OpenAI API 연동 테스트</p>
      </div>
    </header>

    <div id="log"></div>

    <div class="suggestions" id="suggestions">
      <div class="chip" data-msg="브이로그 편집 중인데 잔잔하고 몽환적인 BGM 추천해줘">🎬 잔잔한 브이로그 BGM</div>
      <div class="chip" data-msg="게임 하이라이트 영상에 어울리는 신나는 배경음악이랑 효과음 알려줘">🎮 게임 하이라이트 BGM</div>
      <div class="chip" data-msg="이 음악을 유튜브 영상에 써도 저작권 문제 없을까?">©️ 저작권 문의</div>
      <div class="chip" data-msg="공부/작업용 로파이 BGM 추천해줘, BPM도 알려줘">📚 공부용 Lo-fi</div>
    </div>

    <div class="status-line" id="statusLine">userId: (초기화 중...)</div>

    <form id="composer">
      <textarea id="messageInput" placeholder="모아리에게 메시지를 보내보세요..." rows="1"></textarea>
      <button id="sendBtn" type="submit">전송</button>
    </form>
  </div>

<script>
  // 사용자 식별자: Redis 대화 세션 캐싱(chat:session:{userId}) 데모를 위해 브라우저마다 고정 UUID 사용
  const USER_ID_KEY = 'moari-chat-user-id';
  let userId = localStorage.getItem(USER_ID_KEY);
  if (!userId) {
    userId = (crypto.randomUUID ? crypto.randomUUID() : `user-${Date.now()}`);
    localStorage.setItem(USER_ID_KEY, userId);
  }
  document.getElementById('statusLine').textContent = `userId: ${userId}`;

  const logEl = document.getElementById('log');
  const form = document.getElementById('composer');
  const input = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');

  function appendBubble(role, text) {
    const row = document.createElement('div');
    row.className = `row ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
    return bubble;
  }

  /** SSE 응답 블록("event:.../data:...") 하나를 파싱한다. NestJS @Sse()의 전송 포맷과 일치. */
  function parseSseBlock(block) {
    let event = 'message';
    const dataLines = [];
    for (const line of block.split('\n')) {
      if (line.startsWith('event:')) event = line.slice('event:'.length).trim();
      else if (line.startsWith('data:')) dataLines.push(line.slice('data:'.length).trim());
    }
    return { event, data: dataLines.join('\n') };
  }

  async function sendMessage(message) {
    appendBubble('user', message);

    const assistantBubble = appendBubble('assistant', '');
    assistantBubble.classList.add('typing');

    input.value = '';
    sendBtn.disabled = true;
    input.disabled = true;

    try {
      const res = await fetch('/moari/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, message }),
      });

      if (!res.ok || !res.body) {
        assistantBubble.classList.remove('typing');
        assistantBubble.textContent = `⚠️ 요청 실패 (status: ${res.status}). OPENAI_API_KEY 설정을 확인해주세요.`;
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let assistantText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const blocks = buffer.split('\n\n');
        buffer = blocks.pop() ?? '';

        for (const block of blocks) {
          if (!block.trim()) continue;
          const { event, data } = parseSseBlock(block);

          if (event === 'token') {
            assistantText += data;
            assistantBubble.textContent = assistantText;
            logEl.scrollTop = logEl.scrollHeight;
          } else if (event === 'error') {
            let msg = data;
            try { msg = JSON.parse(data).message; } catch (_) {}
            assistantBubble.classList.remove('typing');
            assistantBubble.textContent = assistantText || `⚠️ 오류: ${msg}`;
          } else if (event === 'done') {
            assistantBubble.classList.remove('typing');
          }
        }
      }
    } catch (err) {
      assistantBubble.classList.remove('typing');
      assistantBubble.textContent = `⚠️ 네트워크 오류: ${err.message}`;
    } finally {
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    sendMessage(message);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  document.getElementById('suggestions').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    input.value = chip.dataset.msg;
    form.requestSubmit();
  });

  appendBubble('assistant', '안녕! 나는 모아리야 🎧 영상 편집 중에 어울리는 BGM이나 효과음이 필요하면 편하게 물어봐줘!');
</script>
</body>
</html>
